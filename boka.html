<!DOCTYPE html>

<html lang="sv">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Boka ditt rum på Hotell Linden. Välj mellan enkelrum, dubbelrum och svit för din vistelse i centrala Stockholm.">
    <title>Hotell Linden - Boka</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <header>
        <a href="index.html" class="logo-link"><div class="logo">LINDEN</div></a>

        <nav>
            <ul>
                <li><a href="index.html">Välkommen</a></li>
                <li><a href="hitta.html">Hitta</a></li>
                <li><a href="meny.html">Meny</a></li>
                <li><a href="boka.html">Boka</a></li>
            </ul>   
        </nav>

        <a href="boka.html" class="book-button">Boka</a>
    </header>

    <main>
        <h1>Boka ditt rum</h1>

        <form>
            <label for="name">Namn:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Epostadress:</label>
            <input type="email" id="email" name="email" required>

            <label for="rumstyp">Rumstyp:</label>
            <div class="select-wrapper">
                <select id="rumstyp" name="rumstyp" required>
                    <option value="">Välj rumstyp</option>
                    <option value="single">Enkelrum</option>
                    <option value="double">Dubbelrum</option>
                    <option value="suite">Svit</option>
                </select>
            </div>

            <button type="submit" class="boka-nu-button">Boka</button>
        </form>

    </main>

    <div class="image-area">
        <img id="room-image" src="images/hotell.webp" alt="Bild på Hotell Linden">
    </div>

    <footer>
        <p class="footer-text">Hotell Linden, Storgatan 1, 113 52 Stockholm</p>
    </footer>

    <script>
        const selectElement = document.getElementById('rumstyp');
        const imageElement = document.getElementById('room-image');

        selectElement.addEventListener('change', function() {
            const selectedValue = this.value;

            if (selectedValue === 'single') {
                imageElement.src = 'images/enkelrum.webp';
                imageElement.alt = 'Bild på enkelrum';
            } else if (selectedValue === 'double') {
                imageElement.src = 'images/dubbelrum.webp';
                imageElement.alt = 'Bild på dubbelrum';
            } else if (selectedValue === 'suite') {
                imageElement.src = 'images/svit.webp';
                imageElement.alt = 'Bild på svit';
            } else {
                imageElement.src = 'images/hotell.webp';
                imageElement.alt = '';
            }
        });
    </script>

</body>
</html>
